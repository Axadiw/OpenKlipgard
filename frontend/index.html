<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Per-route SEO meta (title, description, canonical, OG, Twitter,
       JSON-LD) is emitted by the React <Seo> component on the public
       marketing surface and frozen into static HTML by the
       Playwright-driven prerender step in scripts/cloud/prerender.mjs
       (Klipgard Cloud only). The
       SPA shell index.html below carries only the framework bootstrap
       and PWA/icon metadata — anything route-specific would either
       conflict with React 19's head-hoisting or mislead scrapers on
       the auth-only routes (/login /register) that we explicitly
       Disallow in robots.txt. -->
  <title>Klipgard</title>

  <!-- Favicons and app icons. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- PWA. The manifest declares installable metadata; Apple-specific
       tags are necessary because iOS Safari ignores parts of the
       manifest and uses these instead. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#06070C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Klipgard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Klipgard" />

  <!-- Performance hint. The typefaces are self-hosted (src/fonts, declared in
       src/fonts/fonts.css); preloading the Latin Inter subset lets the browser
       fetch it alongside the stylesheet instead of after it. `crossorigin` is
       required for font preloads even on the same origin. -->
  <link rel="preload" href="/src/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Pre-React boot overlay. The marketing landing for `/` is prerendered
       by scripts/cloud/prerender.mjs and served as static HTML, so a logged-in
       user briefly sees the landing markup before React mounts and routes
       them into the app. The script below detects an auth token in
       localStorage/sessionStorage and paints a fullscreen spinner over
       the prerendered DOM until App.tsx's first useEffect tears it down.
       Self-contained CSS so it works before the bundle CSS finishes
       parsing on a cold load. No-op when no token is present so anonymous
       visitors still see the landing instantly. -->
  <style>
    #boot-overlay { position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; background: #06070C;
      color: #9aa0a6; font-family: Inter, system-ui, sans-serif;
      z-index: 2147483647; }
    #boot-overlay > div { text-align: center; }
    #boot-overlay p { margin-top: 1.5rem; font-size: 0.875rem; }
    html[data-auth-check="1"] body > #root { display: none; }
    html[data-theme="light"] #boot-overlay { background: #ffffff;
      color: #3c4043; }
    /* The Klipgard mark (WEB-SHELL-075) with the focus motion (WEB-SHELL-076) and,
       for a long load, the breathe loop (WEB-SHELL-077): CSS only, transform,
       opacity and filter only. It shows only after 150 ms, so a page that boots
       sooner never flashes it. Times are from the page start: focus 150-1050 ms
       (corners 0-700 ms, K 300-900 ms of it), then the corners breathe, clockwise
       from the top left, 100 ms apart. */
    .kg-boot { --kg-c: #6EE7B7; --kg-k: #E4F8ED; }
    html[data-theme="light"] .kg-boot { --kg-c: #047857; --kg-k: #1F2937; }
    #root > .kg-boot { position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; }
    .kg-boot svg { display: block; width: 96px; height: 96px; margin: 0 auto;
      overflow: visible; opacity: 0; animation: kg-show .2s ease-out .15s forwards; }
    .kg-boot .kg-c { fill: var(--kg-c); transform-box: view-box; transform-origin: 512px 512px;
      animation: kg-in .7s cubic-bezier(.2,.9,.25,1.15) .15s both, kg-breathe 1.6s ease-in-out 1.05s infinite; }
    .kg-boot .kg-tr { animation-delay: .15s, 1.15s; }
    .kg-boot .kg-br { animation-delay: .15s, 1.25s; }
    .kg-boot .kg-bl { animation-delay: .15s, 1.35s; }
    .kg-boot .kg-k { fill: var(--kg-k); transform-box: view-box; transform-origin: 512px 512px;
      animation: kg-k .6s ease-out .45s both; }
    @keyframes kg-show { to { opacity: 1; } }
    @keyframes kg-in { 0% { transform: translate(-90px,-90px); opacity: .15; }
      60% { transform: translate(8px,8px); opacity: 1; } 100% { transform: none; opacity: 1; } }
    @keyframes kg-k { from { opacity: .35; transform: scale(.94); filter: blur(6px); }
      to { opacity: 1; transform: none; filter: none; } }
    @keyframes kg-breathe { 0%, 100% { transform: none; opacity: 1; }
      50% { transform: scale(.82); opacity: .55; } }
    @media (prefers-reduced-motion: reduce) {
      .kg-boot svg, .kg-boot .kg-c, .kg-boot .kg-k { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <script>
    (function () {
      try {
        var token = localStorage.getItem('klipgard-token')
                 || sessionStorage.getItem('klipgard-token');
        if (!token) return;
        var lang = localStorage.getItem('klipgard-lang')
                || (navigator.language || 'en').slice(0, 2).toLowerCase();
        var msgs = {
          en: 'Checking your session…',
          pl: 'Sprawdzanie sesji…',
          de: 'Sitzung wird geprüft…',
          fr: 'Vérification de la session…',
          it: 'Verifica sessione…',
          es: 'Comprobando la sesión…',
          no: 'Sjekker økten…',
          tlh: 'ghuS lulajchugh…'
        };
        var msg = msgs[lang] || msgs.en;
        document.documentElement.setAttribute('data-auth-check', '1');
        var insert = function () {
          if (document.getElementById('boot-overlay')) return;
          var d = document.createElement('div');
          d.id = 'boot-overlay';
          var inner = document.createElement('div');
          inner.className = 'kg-boot';
          var tpl = document.getElementById('kg-boot-mark');
          if (tpl) inner.appendChild(tpl.content.cloneNode(true));
          var p = document.createElement('p');
          p.textContent = msg;
          inner.appendChild(p);
          d.appendChild(inner);
          (document.body || document.documentElement).appendChild(d);
        };
        if (document.body) insert();
        else document.addEventListener('DOMContentLoaded', insert, { once: true });
      } catch (e) { /* storage blocked → fall through to prerendered HTML */ }
    })();
  </script>
</head>
<body>
  <script src="/theme-init.js"></script>
  <!-- The Klipgard mark for the boot overlay above (WEB-SHELL-001) and, inside
       #root, the boot splash a page shows until React replaces it (WEB-SHELL-075). -->
  <template id="kg-boot-mark"><svg viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><path class="kg-c kg-tl" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/><g transform="matrix(-1 0 0 1 1024 0)"><path class="kg-c kg-tr" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/></g><g transform="matrix(-1 0 0 -1 1024 1024)"><path class="kg-c kg-br" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/></g><g transform="matrix(1 0 0 -1 0 1024)"><path class="kg-c kg-bl" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/></g><path class="kg-k" d="M312 294H416V495L601 294H727L533 505.5L729 730H600L416 521V730H312Z"/></svg></template>
  <div id="root"><div class="kg-boot" aria-hidden="true"><svg viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><path class="kg-c kg-tl" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/><g transform="matrix(-1 0 0 1 1024 0)"><path class="kg-c kg-tr" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/></g><g transform="matrix(-1 0 0 -1 1024 1024)"><path class="kg-c kg-br" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/></g><g transform="matrix(1 0 0 -1 0 1024)"><path class="kg-c kg-bl" d="M146 346V228A82 82 0 0 1 228 146H346V200H227A27 27 0 0 0 200 227V346Z"/></g><path class="kg-k" d="M312 294H416V495L601 294H727L533 505.5L729 730H600L416 521V730H312Z"/></svg></div></div>
  <!-- Per-environment keys (ENV-004). Classic script: runs before the deferred module below. -->
  <script src="/runtime-config.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
